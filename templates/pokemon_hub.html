<!DOCTYPE html>
<html>

<head>

    <title>Pokémon Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <a href="/" class="back-btn">
        ← Back
    </a>

    <h1 class="page-title">
        Pokémon Hub
    </h1>

    <div class="feature-grid">

        <a href="/pokedex" class="card-link">
            <div class="card">
                <h3>📖 Pokédex</h3>
                <p>Browse all Pokémon.</p>
            </div>
        </a>

        <a href="/random" class="card-link">
            <div class="card">
                <h3>🎲 Random Pokémon</h3>
                <p>Discover a random Pokémon.</p>
            </div>
        </a>

        <a href="/compare" class="card-link">

    <div class="card">
        <h3>⚔️ Comparison Tool</h3>
        <p>Compare two Pokémon.</p>
    </div>

</a>

        <a href="/evolution" class="card-link">

    <div class="card">

        <h3>🧬 Evolution Explorer</h3>

        <p>Explore Pokémon evolution chains.</p>

    </div>

</a>

        <a href="/types" class="card-link">

    <div class="card">

        <h3>🎨 Types</h3>

        <p>Explore types</p>

    </div>

</a>

        <a href="/quiz" class="card-link">

            <div class="card">
               
            <h3>🧠 Quiz Center</h3>

             <p>
                 Test your Pokémon knowledge
             </p>

            </div>     

</a>

    </div>

</html>
