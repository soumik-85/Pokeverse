<!DOCTYPE html>
<html>

<head>
    <title>Who's That Pokémon?</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<a href="/quiz" class="back-btn">
    ← Back
</a>

<div class="quiz-play-container">

<h1 class="question-category">
    👤 Who's That Pokémon?
</h1>

<h3 id="streak-display" style="
    color: #ffcb05;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 203, 5, 0.5);
">
    🔥 Current Streak: 0
</h3>

    <div class="pokemon-question-card">

        <img
        src="{{ question.image }}"
        class="quiz-pokemon-image">

    </div>

    <div class="answer-grid">

        <button class="answer-card">
            {{ question.options[0] }}
        </button>

        <button class="answer-card">
            {{ question.options[1] }}
        </button>

        <button class="answer-card">
            {{ question.options[2] }}
        </button>

        <button class="answer-card">
            {{ question.options[3] }}
        </button>

    </div>

    <div
    id="correct-answer"
    hidden>

        {{ question.correct_answer }}

    </div>

</div>

<div
id="result-overlay"
class="result-overlay"
style="display:none;">

    <div class="result-modal">

        <h2
        class="correct-text"
        id="result-title">

            ✅ Correct!

        </h2>

        <p id="result-answer">

            It was Pikachu.

        </p>

        <button
        class="next-btn"
        id="next-btn"
        onclick="location.reload()">

            Next Pokémon

        </button>

        <br><br>

        <button
        class="next-btn"
        onclick="window.location.href='/quiz'">

            Quit

        </button>

    </div>

</div>

<script>


const answerButtons = document.querySelectorAll(".answer-card");

const correctAnswer = document
    .getElementById("correct-answer")
    .innerText.trim();

const modal = document.getElementById("result-overlay");
const resultTitle = document.getElementById("result-title");
const resultAnswer = document.getElementById("result-answer");
const streakDisplay = document.getElementById("streak-display");

const MODE = "pokemon";
const STORAGE_KEY = "pokeverse_streak_" + MODE;

let currentStreak = Number(sessionStorage.getItem(STORAGE_KEY)) || 0;
let answered = false;

streakDisplay.innerText = "🔥 Current Streak: " + currentStreak;

// Save the personal best through Flask.
// The backend only updates the record when the new streak is higher.
function saveStreak() {
    fetch("/quiz/leaderboard/save-streak", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            mode: MODE,
            streak: currentStreak
        })
    }).catch(error => {
        console.error("Could not save streak:", error);
    });
}

answerButtons.forEach(button => {
    button.addEventListener("click", () => {

        if (answered) return;
        answered = true;

        const selectedAnswer = button.innerText.trim();

        if (selectedAnswer === correctAnswer) {

            currentStreak++;

            sessionStorage.setItem(STORAGE_KEY, currentStreak);

            resultTitle.innerText = "✅ Correct!";
            resultAnswer.innerText = "It was " + correctAnswer;

            saveStreak();

        } else {

            currentStreak = 0;

            sessionStorage.setItem(STORAGE_KEY, 0);

            resultTitle.innerText = "❌ Wrong!";
            resultAnswer.innerText = "Correct Answer: " + correctAnswer;
        }

        streakDisplay.innerText = "🔥 Current Streak: " + currentStreak;

        modal.style.display = "flex";
    });
});

// Quit ends this session. The best record has already been submitted
// after every correct answer.
document.querySelectorAll(".result-modal button").forEach(button => {
    if (button.innerText.trim() === "Quit") {
        button.addEventListener("click", () => {
            sessionStorage.removeItem(STORAGE_KEY);
        });
    }
});


</script>

</body>

</html>
