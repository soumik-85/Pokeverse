<!DOCTYPE html>
<html>

<head>

    <title>Pokémon Master Challenge</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<a href="/quiz/master" class="back-btn">
    ← Quit Challenge
</a>

<div class="quiz-play-container">

    <div class="progress-container">

        <div class="progress-bar" id="progress-bar"></div>

    </div>

    <h2 class="question-counter" id="question-counter">
        Question 1 / 10
    </h2>

    <div class="pokemon-question-card">

        <img
        id="pokemon-image"
        src="{{ question.image }}"
        class="quiz-pokemon-image">

    </div>

    <h2
    class="question-category"
    id="question-text">

    {{ question.question }}

    </h2>


<div class="answer-grid">

    <button
        type="button"
        class="answer-card"
        id="option0">
        {{ question.options[0] }}
    </button>

    <button
        type="button"
        class="answer-card"
        id="option1">
        {{ question.options[1] }}
    </button>

    <button
        type="button"
        class="answer-card"
        id="option2">
        {{ question.options[2] }}
    </button>

    <button
        type="button"
        class="answer-card"
        id="option3">
        {{ question.options[3] }}
    </button>

    <div id="correct-answer" hidden>
        {{ question.correct_answer }}
    </div>

</div>


<div id="correct-answer" hidden>

    {{ question.correct_answer }}

</div>

    </div>

   <div class="result-overlay" id="result-overlay">

    <div class="result-modal">

        <h2 class="correct-text" id="result-title">
            ✅ Correct!
        </h2>

        <p id="result-answer">
            It was Pikachu.
        </p>

        <p id="score-text">
            Score: 0 / 10
        </p>

        <button 
        class="next-btn"
        id="next-question-btn">
            Next Question
        </button>

    </div>

</div>

</div>

<script>
    const quizQuestions = {{ questions | tojson }};

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const challengeStartTime = Date.now();

    function loadQuestion(index){

    const question =
    quizQuestions[index];

    document.getElementById(
    "question-text"
    ).innerText =
    question.question;

    document.getElementById(
        "pokemon-image"
    ).src = question.image;

    document.getElementById(
        "option0"
    ).innerText =
    question.options[0];

    document.getElementById(
        "option1"
    ).innerText =
    question.options[1];

    document.getElementById(
        "option2"
    ).innerText =
    question.options[2];

    document.getElementById(
        "option3"
    ).innerText =
    question.options[3];

    document.getElementById(
        "correct-answer"
    ).innerText =
    question.correct_answer;

    document.getElementById(
        "question-counter"
    ).innerText =
    `Question ${index + 1} / 10`;

    document.getElementById(
        "progress-bar"
    ).style.width =
    `${index * 10}%`;

}

loadQuestion(0);

console.log(quizQuestions);   

const answerCards =
document.querySelectorAll(".answer-card");

answerCards.forEach(card => {

    card.addEventListener("click", (event) => {

        event.preventDefault();

if (answered) return;
answered = true;

const selectedAnswer =
        card.innerText.trim();

        const modal =
document.getElementById(
    "result-overlay"
);

const resultTitle =
document.getElementById(
    "result-title"
);

const resultAnswer =
document.getElementById(
    "result-answer"
);

const correctAnswer =
document.getElementById(
    "correct-answer"
).innerText.trim();

if(selectedAnswer === correctAnswer){

    resultTitle.innerText =
    "✅ Correct!";

    resultAnswer.innerText =
    "It was " + correctAnswer;
    score++;

}
else{

    resultTitle.innerText =
    "❌ Wrong!";

    resultAnswer.innerText =
    "Correct Answer: " +
    correctAnswer;

}

document.getElementById(
    "score-text"
).innerText =
`Score: ${score} / 10`;

if(currentQuestion === 9){

    document.getElementById(
        "next-question-btn"
    ).innerText =
    "View Results";

}
else{

    document.getElementById(
        "next-question-btn"
    ).innerText =
    "Next Question";

}

modal.style.display = "flex";

    });

});

const nextButton =
document.getElementById(
    "next-question-btn"
);

nextButton.addEventListener(
    "click",
    () => {

        if(currentQuestion < 9){

           currentQuestion++;

answered = false;

loadQuestion(
    currentQuestion
);

            document.getElementById(
                "result-overlay"
            ).style.display =
            "none";

        }

        else{

            console.log("Final Score:", score);

            const completionTime = Math.max(
    1,
    Math.round((Date.now() - challengeStartTime) / 1000)
);

fetch("/quiz/leaderboard/save-challenge", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        score: score,
        completion_time: completionTime
    })
})
.then(response => {
    if (!response.ok && response.status !== 401) {
        throw new Error("Could not save challenge result");
    }

    window.location.href = "/quiz/results";
})
.catch(error => {
    console.error(error);
    window.location.href = "/quiz/results";
});
        }

    }
);

</script>

</body>

</html>
